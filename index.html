<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA Online Vehicle Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0e14;
      --panel-bg: #141822;
      --card-bg: #1e2430;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-red: #ff4d4d;
      --accent-green: #00e676;
      --accent-gray: #768390;
      --gta-yellow: #f1c40f;
      --border-color: #2d3545;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.4rem;
      letter-spacing: 2px;
      color: var(--text-main);
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(241, 196, 15, 0.2);
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    /* Progress Widget */
    .progress-section {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .progress-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .progress-stats {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--gta-yellow);
    }

    .progress-bar-container {
      width: 100%;
      height: 20px;
      background: #080a0f;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00c853, #00e676);
      transition: width 0.4s ease-in-out;
      box-shadow: 0 0 14px rgba(0, 230, 118, 0.6);
    }

    .progress-legend {
      display: flex;
      gap: 20px;
      margin-top: 14px;
      font-size: 0.95rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot.red { background: var(--accent-red); box-shadow: 0 0 6px var(--accent-red); }
    .dot.green { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
    .dot.gray { background: var(--accent-gray); }

    /* Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-filter, .btn-sort {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .btn-filter:hover, .btn-filter.active,
    .btn-sort:hover, .btn-sort.active {
      color: var(--text-main);
      border-color: var(--gta-yellow);
      background: var(--card-bg);
    }

    .action-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-input {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1rem;
      width: 240px;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--gta-yellow);
    }

    .btn-reset {
      background: rgba(255, 77, 77, 0.1);
      border: 1px solid rgba(255, 77, 77, 0.4);
      color: var(--accent-red);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .btn-reset:hover {
      background: rgba(255, 77, 77, 0.25);
    }

    /* Table Styles */
    .table-container {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background: #0f121a;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr.vehicle-row {
      transition: background 0.15s ease;
    }

    tr.vehicle-row:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    /* Vehicle Color Classifications */
    .status-red .vehicle-name {
      color: var(--accent-red);
      font-weight: 700;
    }

    .status-green .vehicle-name {
      color: var(--accent-green);
      font-weight: 700;
      text-decoration: line-through;
      opacity: 0.85;
    }

    .status-gray .vehicle-name {
      color: var(--accent-gray);
      font-weight: 600;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-red { background: rgba(255, 77, 77, 0.15); color: var(--accent-red); border: 1px solid rgba(255, 77, 77, 0.3); }
    .badge-green { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); border: 1px solid rgba(0, 230, 118, 0.3); }
    .badge-gray { background: rgba(118, 131, 144, 0.15); color: var(--accent-gray); border: 1px solid rgba(118, 131, 144, 0.3); }

    /* Custom Checkbox */
    .checkbox-cell {
      text-align: center;
      width: 60px;
    }

    .custom-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--accent-green);
    }

    .site-pill {
      background: #1e2430;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.88rem;
      border: 1px solid #2d3545;
      display: inline-block;
    }

    .price-text {
      font-weight: 700;
      color: var(--gta-yellow);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>GTA Online Vehicle Tracker</h1>
      <p class="subtitle">Progression Checklist</p>
    </header>

    <!-- Progress Tracker -->
    <div class="progress-section">
      <div class="progress-header">
        <span class="progress-title">Livery Collection Progression</span>
        <span class="progress-stats" id="progressText">0% (0 / 0)</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="progress-legend">
        <span class="legend-item"><span class="dot red"></span> Red: Uncompleted</span>
        <span class="legend-item"><span class="dot green"></span> Green: Completed</span>
        <span class="legend-item"><span class="dot gray"></span> Gray: Optional</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="filter-group">
        <button class="btn-filter active" onclick="setFilter('all', this)">All</button>
        <button class="btn-filter" onclick="setFilter('locked', this)">Locked</button>
        <button class="btn-filter" onclick="setFilter('unlocked', this)">Completed</button>
        <button class="btn-filter" onclick="setFilter('optional', this)">Optional</button>
      </div>

      <div class="filter-group">
        <button class="btn-sort active" onclick="setPriceSort('default', this)">Default Sort</button>
        <button class="btn-sort" onclick="setPriceSort('low-high', this)">Price: Low to High</button>
        <button class="btn-sort" onclick="setPriceSort('high-low', this)">Price: High to Low</button>
      </div>

      <div class="action-group">
        <input type="text" id="searchInput" class="search-input" placeholder="Search vehicle or site..." oninput="renderTable()">
        <button class="btn-reset" onclick="resetProgression()">Reset All</button>
      </div>
    </div>

    <!-- Vehicle Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th class="checkbox-cell"> </th>
            <th>Vehicle Name</th>
            <th>Source</th>
            <th>Price</th>
            <th>Where to get?</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="vehicleTableBody">
          <!-- Rows dynamically rendered here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Initial Vehicle Dataset from spreadsheet & user specifications
    const defaultVehicles = [
      // Main Progression Tracked Vehicles (Red / Locked initial status)
      { id: '1', name: 'Annis Euros', site: 'Southern San Andreas Super Autos (2-Door Legendary)', price: '1.8m', livery: 'Drift', status: 'red' },
      { id: '2', name: 'Annis Remus', site: 'Southern San Andreas Super Autos (2-Door Standard)', price: '1.3m', livery: 'Stock, Rep, Drift', status: 'red' },
      { id: '3', name: 'Annis ZR350', site: 'Southern San Andreas Super Autos (2-Door Legendary)', price: '1.6m', livery: 'Stock, Drift', status: 'red' },
      { id: '4', name: 'Canis Terminus', site: 'Southern San Andreas Super Autos (4-Door Standard)', price: '1.9m', livery: 'Stock', status: 'red' },
      { id: '5', name: 'Declasse Impaler LX', site: 'Southern San Andreas Super Autos (2-Door Standard)', price: '1.5m', livery: 'Stock', status: 'red' },
      { id: '6', name: 'Declasse Scramjet', site: 'Warstock Cache & Carry', price: '4m', livery: 'Stock', status: 'red' },
      { id: '7', name: 'Dinka Kanjo SJ', site: 'Southern San Andreas Super Autos (2-Door Standard)', price: '1.4m', livery: 'Stock', status: 'red' },
      { id: '8', name: 'Dinka RT3000', site: 'Southern San Andreas Super Autos (2-Door Standard)', price: '1.72m', livery: 'Stock, Stock, Rep', status: 'red' },
      { id: '9', name: 'Dinka Sugoi', site: 'Southern San Andreas Super Autos (4-Door Standard)', price: '1.23m', livery: 'Stock', status: 'red' },
      { id: '10', name: 'Dinka Veto Modern', site: 'Southern San Andreas Super Autos (Southern Special)', price: '1m', livery: 'Stock', status: 'red' },
      { id: '11', name: 'Grotti Turismo Omaggio', site: 'Southern San Andreas Super Autos (2-Door Legendary)', price: '2.85m', livery: 'Stock', status: 'red' },
      { id: '12', name: 'Karin Futo GTX', site: 'Southern San Andreas Super Autos (2-Door Standard)', price: '1.6m', livery: 'Drift, Rep', status: 'red' },
      { id: '13', name: 'Karin Sultan RS', site: 'Benny\'s Original Motor Works (Conversion)', price: '810k', livery: 'Stock', status: 'red' },
      { id: '14', name: 'Maibatsu Penumbra FF', site: 'Southern San Andreas Super Autos (2-Door Standard)', price: '1.4m', livery: 'Stock', status: 'red' },
      { id: '15', name: 'Ocelot Jugular', site: 'Southern San Andreas Super Autos (4-Door Legendary)', price: '1.3m', livery: 'Stock', status: 'red' },
      { id: '16', name: 'Ubermacht Sentinel Classic Widebody', site: 'Benny\'s Original Motor Works (Conversion)', price: '1.7m', livery: 'Drift', status: 'red' },
      { id: '17', name: 'Ubermacht Zion Classic', site: 'Southern San Andreas Super Autos (2-Door Standard)', price: '812k', livery: 'Stock', status: 'red' },
      { id: '18', name: 'Ubermacht Sentinel Classic', site: 'Southern San Andreas Super Autos (2-Door Standard)', price: '650k', livery: 'Stock', status: 'red' },
      { id: '19', name: 'Dinka Blista Kanjo', site: 'Southern San Andreas Super Autos (2-Door Standard)', price: '580k', livery: 'Stock', status: 'red' },
      { id: '20', name: 'Annis Hardy', site: 'Southern San Andreas Super Autos (2-Door Standard)', price: '1.2m', livery: 'Stock', status: 'red' },
      { id: '21', name: 'Karin S95', site: 'Southern San Andreas Super Autos (2-Door Standard)', price: '1.99m', livery: 'Stock', status: 'red' },
      { id: '22', name: 'Karin Futo', site: 'Southern San Andreas Super Autos (2-Door Standard)', price: '9k', livery: 'Stock', status: 'red' },
      { id: '23', name: 'Dinka/Karin Chavos V6', site: 'Southern San Andreas Super Autos (4-Door Standard)', price: '1.1m', livery: 'Stock', status: 'red' },

      // Optional Vehicles (Excluded from completion %)
      { id: '24', name: 'Bollokan Envisage', site: 'Southern San Andreas Super Autos (2-Door Legendary)', price: '2.4m', livery: 'Stock', status: 'gray' },
      { id: '25', name: 'Nagasaki Shinobi', site: 'Legendary Motorsport (Bike)', price: '2.5m', livery: 'Stock', status: 'gray' },
      { id: '26', name: 'Mammoth F-160 Raiju', site: 'Warstock Cache & Carry', price: '7m', livery: 'Stock, Stock', status: 'gray' },
      { id: '27', name: 'Volatol', site: 'Warstock Cache & Carry', price: '4m', livery: 'Stock', status: 'gray' }
    ];

    let vehicles = [];
    let currentFilter = 'all';
    let currentSort = 'default';
    let db = null;

    // Helper to parse price string into pure numeric value for sorting
    function parsePriceValue(priceStr) {
      if (!priceStr || priceStr === 'N/A') return -1;
      let str = priceStr.toLowerCase().trim();
      if (str.endsWith('m')) {
        return parseFloat(str.replace('m', '')) * 1000000;
      }
      if (str.endsWith('k')) {
        return parseFloat(str.replace('k', '')) * 1000;
      }
      return parseFloat(str) || 0;
    }

    // --- IndexedDB Database Connection ---
    function initDatabase() {
      const request = indexedDB.open('GTAOnlineVehicleTrackerDB', 2);

      request.onupgradeneeded = (e) => {
        const dbInstance = e.target.result;
        if (dbInstance.objectStoreNames.contains('vehicles')) {
          dbInstance.deleteObjectStore('vehicles');
        }
        dbInstance.createObjectStore('vehicles', { keyPath: 'id' });
      };

      request.onsuccess = (e) => {
        db = e.target.result;
        loadState();
      };

      request.onerror = (e) => {
        console.warn('IndexedDB unavailable. Fallback to LocalStorage.', e);
        loadStateLocalStorage();
      };
    }

    function loadState() {
      if (!db) {
        loadStateLocalStorage();
        return;
      }

      const tx = db.transaction('vehicles', 'readonly');
      const store = tx.objectStore('vehicles');
      const getAll = store.getAll();

      getAll.onsuccess = () => {
        const savedData = getAll.result;
        if (savedData && savedData.length > 0) {
          vehicles = defaultVehicles.map(def => {
            const saved = savedData.find(s => s.id === def.id);
            return saved ? { ...def, status: saved.status } : def;
          });
        } else {
          vehicles = JSON.parse(JSON.stringify(defaultVehicles));
          saveAllState();
        }
        renderTable();
        updateProgress();
      };
    }

    function saveItemState(item) {
      if (db) {
        const tx = db.transaction('vehicles', 'readwrite');
        const store = tx.objectStore('vehicles');
        store.put(item);
      }
      localStorage.setItem('gta_vehicles_v2', JSON.stringify(vehicles));
    }

    function saveAllState() {
      if (db) {
        const tx = db.transaction('vehicles', 'readwrite');
        const store = tx.objectStore('vehicles');
        vehicles.forEach(v => store.put(v));
      }
      localStorage.setItem('gta_vehicles_v2', JSON.stringify(vehicles));
    }

    function loadStateLocalStorage() {
      const stored = localStorage.getItem('gta_vehicles_v2');
      if (stored) {
        const savedData = JSON.parse(stored);
        vehicles = defaultVehicles.map(def => {
          const saved = savedData.find(s => s.id === def.id);
          return saved ? { ...def, status: saved.status } : def;
        });
      } else {
        vehicles = JSON.parse(JSON.stringify(defaultVehicles));
      }
      renderTable();
      updateProgress();
    }

    function resetProgression() {
      if (!confirm('Are you sure you want to reset all vehicle progression?')) return;
      vehicles = JSON.parse(JSON.stringify(defaultVehicles));
      saveAllState();
      renderTable();
      updateProgress();
    }

    // --- Logic & Rendering ---
    function toggleVehicle(id) {
      const vehicle = vehicles.find(v => v.id === id);
      if (!vehicle || vehicle.status === 'gray') return;

      if (vehicle.status === 'red') {
        vehicle.status = 'green';
      } else if (vehicle.status === 'green') {
        vehicle.status = 'red';
      }

      saveItemState(vehicle);
      renderTable();
      updateProgress();
    }

    function updateProgress() {
      const trackedVehicles = vehicles.filter(v => v.status !== 'gray');
      const totalTracked = trackedVehicles.length;
      const completedCount = trackedVehicles.filter(v => v.status === 'green').length;
      const percentage = totalTracked > 0 ? Math.round((completedCount / totalTracked) * 100) : 0;

      document.getElementById('progressText').innerText = `${percentage}% (${completedCount} / ${totalTracked})`;
      document.getElementById('progressBar').style.width = `${percentage}%`;
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTable();
    }

    function setPriceSort(sortMode, btn) {
      currentSort = sortMode;
      document.querySelectorAll('.btn-sort').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('vehicleTableBody');
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      tbody.innerHTML = '';

      let filtered = vehicles.filter(v => {
        const matchesSearch = v.name.toLowerCase().includes(search) || v.site.toLowerCase().includes(search);
        
        if (!matchesSearch) return false;
        if (currentFilter === 'locked') return v.status === 'red';
        if (currentFilter === 'unlocked') return v.status === 'green';
        if (currentFilter === 'optional') return v.status === 'gray';
        return true;
      });

      // Apply sorting logic
      if (currentSort === 'low-high') {
        filtered.sort((a, b) => parsePriceValue(a.price) - parsePriceValue(b.price));
      } else if (currentSort === 'high-low') {
        filtered.sort((a, b) => parsePriceValue(b.price) - parsePriceValue(a.price));
      } else {
        // Default sort based on original array index/ID order
        filtered.sort((a, b) => parseInt(a.id) - parseInt(b.id));
      }

      filtered.forEach(v => {
        const row = document.createElement('tr');
        row.className = `vehicle-row status-${v.status}`;

        const isChecked = v.status === 'green';
        const isOptional = v.status === 'gray';

        let badgeLabel = 'Locked';
        let badgeClass = 'badge-red';

        if (v.status === 'green') {
          badgeLabel = 'Completed';
          badgeClass = 'badge-green';
        } else if (isOptional) {
          badgeLabel = 'Optional';
          badgeClass = 'badge-gray';
        }

        row.innerHTML = `
          <td class="checkbox-cell">
            <input type="checkbox" 
                   class="custom-checkbox" 
                   ${isChecked ? 'checked' : ''} 
                   ${isOptional ? 'disabled' : ''} 
                   onchange="toggleVehicle('${v.id}')">
          </td>
          <td class="vehicle-name">${v.name}</td>
          <td><span class="site-pill">${v.site}</span></td>
          <td class="price-text">${v.price}</td>
          <td>${v.livery}</td>
          <td><span class="status-badge ${badgeClass}">${badgeLabel}</span></td>
        `;

        tbody.appendChild(row);
      });
    }

    // Initialize Database on load
    window.addEventListener('DOMContentLoaded', initDatabase);
  </script>
</body>
</html>
